name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # 3.8 是脚本声明的最低版本（README 写着 Python 3.8+），必须真跑一遍；
        # 3.13 是为了提前发现「新版本把某个 API 删了」这类问题。
        # macos-latest 是 arm64，3.8 没有 arm64 构建，所以只挂 3.12。
        include:
          - { os: ubuntu-latest,  py: "3.8"  }
          - { os: ubuntu-latest,  py: "3.11" }
          - { os: ubuntu-latest,  py: "3.13" }
          - { os: windows-latest, py: "3.8"  }
          - { os: windows-latest, py: "3.13" }
          - { os: macos-latest,   py: "3.12" }

    env:
      # Windows 默认控制台编码是 cp936/cp1252，中文测试名与断言消息会乱码或抛
      # UnicodeEncodeError —— 强制 UTF-8，让三个平台表现一致。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: 环境信息
        run: python -c "import sys, platform; print(sys.version); print(platform.platform())"

      - name: 跑测试
        run: python -m pytest tests/contract -q --tb=short

      # 脚本自己会写一份运行日志（src/pojia.log）。测试挂了就看它 ——
      # 比 pytest 的 traceback 更接近「脚本当时到底走了哪条分支」。
      - name: 失败时上传运行日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pojia-log-${{ matrix.os }}-py${{ matrix.py }}
          path: src/pojia.log
          if-no-files-found: ignore
          retention-days: 7
